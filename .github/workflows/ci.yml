name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-vet-test:
    runs-on: ubuntu-latest
    # No service containers: Phase 0-3 run entirely against stub/local
    # adapters with zero external infrastructure (see specs/roadmap.md
    # and specs/2026-11-09-scaffolding-core-architecture/validation.md).
    # Real PostgreSQL/RabbitMQ/MinIO service containers are introduced
    # only alongside the Final Phase's integration tests.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Test
        run: make test

  integration-test:
    runs-on: ubuntu-latest
    # Docker is available by default on GitHub-hosted ubuntu runners,
    # which testcontainers-go needs to spin up Postgres/RabbitMQ/MinIO.
    # This is the first job in this project's CI that uses service
    # containers at all (specs/2026-11-10-mvp/requirements.md
    # Decision 6) - unverified in this phase, see
    # test/integration/mvp_test.go's own warning comment.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Integration test
        run: make test-integration
